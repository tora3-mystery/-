 else if((t.tech+(S.reforms.tech||0)*.5)>=7&&active.some(f=>['robot','office','clinic','farm'].includes(f.kind)&&f.focus==='tech'&&f.stage>=1))add('技術改革に挑む村',t.tech+3,'技術面の改善に取り組む施設が増えています。');
 if(t.strange>=6&&active.some(f=>['shrine','museum'].includes(f.kind)&&f.stage>=1))add('不思議な噂の村',t.strange+3,'奇妙な逸話や資料を紹介する施設が注目されています。');
 if(['coast','island'].includes(S.terrain)&&t.sea>=7&&has('harbor',1))add('海の恵みの村',t.sea+4,'港の整備が進み、海の資源が村の魅力になりました。');
 if(S.population<=S.startPopulation*.86)add('人が減り続ける村',20+(S.startPopulation-S.population)/10,'村の定住人口は減少しました。');
 if(S.visitors>=S.startVisitors*1.8)add('観光客の村',12+S.visitors/S.startVisitors,'旅行者の増加が村の風景を変えています。');
 if(n>=3)add('施設が育った村',10+n*2,'いくつもの建物が新しい用途やサービスを取り入れました。');
 if(!candidates.length)add('いつもの暮らしがある村',1,'目立つ変貌がなくても、村の日常には少しずつ新しい出来事がありました。');
 candidates.sort((a,b)=>b.score-a.score);
 let hidden=null;const ids=S.facilities.map(f=>f.kind),reviews=S.reviewHistory||[],last=reviews[reviews.length-1];
 const distinct=tag=>new Set(reviews.filter(r=>r.tag===tag&&r.stars>=4).map(r=>r.id)).size;
 if(S.month===12&&S.secrets.ancient&&t.tradition>=7&&t.history>=3&&distinct('tradition')>=2&&ids.some(x=>['shrine','hall'].includes(x))&&ids.includes('office')&&last?.kind==='office'&&last?.tag==='tradition'&&last?.stars>=4)hidden='因習村';
 if(S.month===12&&S.secrets.robot&&t.tech>=10&&ids.includes('robot')&&distinct('tech')>=2&&last?.kind==='robot'&&last?.tag==='tech'&&last?.stars>=4)hidden='近未来の村';
 if(S.month===12&&S.secrets.deep&&t.sea>=9&&ids.includes('harbor')&&distinct('sea')>=2&&last?.kind==='harbor'&&last?.tag==='sea'&&last?.stars>=4)hidden='海とつながりすぎた村';
 if(hidden&&!S.achievements.includes(hidden))S.achievements.push(hidden);
 const hiddenDesc={因習村:'村で生まれた新しい決まりが、いつからか「昔からの伝統」として扱われています。村の外に出る際は、事前の届け出が必要です。',近未来の村:'ロボットが村の新しい住民として迎えられ、行政・交通・生活設備は人間がいなくても稼働するようになりました。空中道路の建設も始まっています。',海とつながりすぎた村:'役場に新しい住民登録の申請が届きました。申請された住所を確かめると、そこは海面下でした。'};
 return {main:hidden?{name:hidden,desc:hiddenDesc[hidden],hidden:true}:candidates[0],sub:candidates.filter(x=>x.name!==hidden).slice(hidden?0:1,hidden?2:3),hidden};
}
function villageVoices(){
 if(S.month===0)return ['住民：「最近はいつもどおりの村ですよ。ゆっくり見ていってください。」','村民：「どんな感想が届くのか、楽しみですね。」'];
 const a=S.facilities.filter(f=>f.open),c=S.facilities.filter(f=>!f.open),grown=a.filter(f=>f.stage>=2),items=[];
 if(c.length)items.push('住民：「'+c[0].name+'が閉まって、買い物や集まり方が変わりました。」');

 if(S.population<S.startPopulation-10)items.push('年配の住民：「店が増えても、住んでいる人は少しずつ減っています。」');
 if(grown.length)items.push('近所の人：「'+grown[0].name+'は、ほんの数か月前とは別の場所みたいです。」');
 if(['island','coast'].includes(S.terrain))items.push('漁師：「海の様子は毎年違いますが、観光客には伝わりにくいですね。」');

function villageMood(){const closed=S.facilities.filter(f=>!f.open).length,grown=S.facilities.filter(f=>f.open&&f.stage>=2).length,concerns=(closed?2:0)+(S.quiet<45?1:0)+(S.economy<35?2:0)+(S.visitors>S.startVisitors*1.7?1:0),positives=(S.economy>60?1:0)+(grown>=2?1:0)+(S.population>S.startPopulation?1:0);return concerns>positives+1?'不満が増えている':positives>concerns+1?'好評の声が多い':'意見が分かれている'}
function render(){const p=period(S.completed?-1:0),d=terrain();$('period').textContent=p.year+'年'+p.month+'月 ｜ '+(S.completed?'1年間の記録・完了':'1年目');$('villageName').textContent=S.name;$('terrain').textContent=d.label;$('profile').textContent=d.qualifier+'村。都市から約'+Math.round(S.cityMins/60*10)/10+'時間 / '+(S.stationMins===null?'鉄道なし・船便利用':'最寄駅から車で約'+S.stationMins+'分')+'。'+trait().intro;$('stats').innerHTML=[['人口',safe(S.population)+'人','定住者'],['観光客',safe(S.visitors)+'人','月間推定'],['経済',S.economy+'/100','村の活力'],['静けさ',S.quiet+'/100','高いほど静か']].map(a=>'<div class="stat"><span>'+a[0]+'</span><b>'+a[1]+'</b><small>'+a[2]+'</small></div>').join('');
 let map=$('map');map.className='map'+(['coast','island'].includes(S.terrain)?' water':S.terrain==='river'?' river':S.terrain==='mountain'?' mountain':'');let facilities=S.facilities;map.innerHTML=facilities.map(f=>'<button type="button" class="site '+(!f.open?'closed':S.candidates.includes(f.id)?'eligible':'notEligible')+(f.id===chosen?' selected':'')+' stage'+f.stage+(f.lastChanged>=S.month-1&&S.month>0?' changed':'')+'" data-id="'+f.id+'" aria-label="'+f.name+(f.open?'':' 閉業')+'"><span class="emoji">'+DEFS[f.kind].icon+'</span><span class="siteName">'+f.name+'</span><span class="newStage">'+(f.stage>0?phaseName(f):'')+'</span><span class="marker">'+(!f.open?'閉業':S.completed?'1年の記録':S.candidates.includes(f.id)?'今月訪問可':'観察のみ')+'</span></button>').join('');map.querySelectorAll('.site').forEach(el=>el.addEventListener('click',()=>{chosen=el.dataset.id;selectedFact=0;currentStars=4;render()}));
 $('residentVoices').innerHTML='<strong>💬 村民の声｜'+(S.month===0?'訪問前':villageMood())+'</strong>'+villageVoices().map(v=>'<p>'+v+'</p>').join('');$('news').textContent=(S.lastReview?'最近の村ニュース：'+S.log[0].title+'。':'村の近況：観光客の口コミを参考に、施設が少しずつ姿を変えているようです。');$('history').innerHTML=S.log.slice(0,8).map(l=>'<div class="historyItem"><strong>'+timeName(l.month)+'｜'+l.title+'</strong>'+l.detail+'</div>').join('');$('monthTitle').textContent=S.completed?'1年間の口コミが完了':'候補 '+S.candidates.length+'施設';$('monthCount').innerHTML=Array.from({length:12},(_,i)=>'<span class="'+(i<(S.completed?12:S.month%12)?'filled':'')+'"></span>').join('');$('progressBar').style.width=((S.completed?12:S.month%12)/12*100)+'%';$('candidatesNote').textContent=S.completed?'1年分の口コミが終わりました。施設の変化を見返したり、新しい村で遊べます。':'緑枠の施設から今月のレビューを1件選べます。地図の他施設も観察可能です。';renderDetail();}
function timeName(month){const p=period(month-S.month-1);return p.year+'年'+p.month+'月'}
function renderDetail(){const f=find(chosen);if(!f){$('detail').innerHTML=S.completed?'<div class="endingPanel"><h2>1年間の村づくり、おつかれさまでした。</h2><p>12件の口コミで、この村の1年が完成しました。</p><button id="replayAnnual" class="btn primary">1年の村レポートを見る</button></div>':'<p>訪問する施設を選んでください。</p>';if(S.completed&&$('replayAnnual'))$('replayAnnual').addEventListener('click',showAnnual);return}const eligible=S.candidates.includes(f.id)&&f.open;const facts=factsFor(f),visits=S.facilities.filter(x=>x.open).length;
 let html='<div class="visit"><div class="visitIcon">'+DEFS[f.kind].icon+'</div><div><div class="visitTitle">'+f.name+'</div><div class="tiny">'+phaseName(f)+' ｜ '+(f.open?'営業中':'閉業')+'</div></div></div><div class="smallHeading">現地で確認できたこと</div>';

 html+='<div class="voices">'+voice(f)+'</div>';
 if(eligible){let fa=facts[selectedFact];html+='<div class="smallHeading">あなたなら、どのように評価する？</div><div class="stars" role="group" aria-label="星評価">'+[1,2,3,4,5].map(n=>'<button type="button" data-star="'+n+'" aria-label="星'+n+'" aria-pressed="'+(n===currentStars)+'" class="star '+(n<=currentStars?'on':'')+'">★</button>').join('')+'</div><div class="reviewPreview" id="reviewText">'+reviewText(f,fa,currentStars)+'</div><div class="reviewFoot">星評価は村の反応に影響します。結果は今の村の状態次第です。</div><button id="postBtn" class="submit" type="button">口コミを投稿する → 1か月進む</button>'}
 else html+='<div class="locked">'+(S.completed?'1年間の口コミが終了しました。新しい村でまた遊べます。':f.open?'今月は訪問候補に入っていません。他の緑枠の施設を選んでください。':'閉業中の施設にはレビューできません。')+'</div>';
 $('detail').innerHTML=html;document.querySelectorAll('[data-fact]').forEach(b=>b.addEventListener('click',()=>{if(!eligible)return;selectedFact=+b.dataset.fact;renderDetail()}));document.querySelectorAll('[data-star]').forEach(b=>b.addEventListener('click',()=>{currentStars=+b.dataset.star;renderDetail()}));if($('postBtn'))$('postBtn').addEventListener('click',nextReview)}
function showModal(content){$('modal').innerHTML=content;$('overlay').classList.add('show');$('modal').scrollTop=0}
function hideModal(){$('overlay').classList.remove('show')}
function chg(n){return(n>0?'+':'')+safe(n)}
function showResults(){
 const r=S.result;if(!r)return;
 const majors=r.changes.filter(e=>['big','closed','chain','ripple'].includes(e.kind));
 const chosenEvent=majors.find(e=>e.kind==='big')||majors[0]||r.changes[0],others=r.changes.filter(e=>e!==chosenEvent);
 const headline=chosenEvent.kind==='closed'?'閉業のお知らせ':majors.length>=2?'村のあちこちが同時に変化！':majors.length?'村に大きな変化！':'口コミが村を動かしました！';
 const cascade=others.filter(e=>['big','ripple','chain','auto'].includes(e.kind)).length;
 const title=cascade>=2?'さらに、ほかの施設も一斉に変化！':cascade?'別の施設にも変化が！':'翌月の村の動き';
 const list=others.map(e=>'<div class="'+(['big','chain','ripple','auto'].includes(e.kind)?'wow':'')+'"><strong>'+e.icon+' '+e.title+'</strong><p style="margin:3px 0">'+e.detail+'</p></div>').join('');
 const content='<div class="modalHead">'+r.date+'の口コミが反映されました</div><div class="resultArt '+(majors.length?'major':'')+'"><div class="headline">'+headline+'</div><div class="icon">'+chosenEvent.icon+'</div><div class="type">'+chosenEvent.title+'</div><div class="heroDetail">'+chosenEvent.detail+'</div></div><div class="tiny">あなたが投稿した口コミ</div><div style="font-weight:700;margin:5px 0 13px">'+('★'.repeat(r.stars))+' '+r.post+'</div>'+(others.length?'<div class="cascadeHeader">'+title+'</div><div class="effects">'+list+'</div>':'')+'<div class="resultStats">'+[['人口','人',r.after.population-r.prev.population],['観光客','人',r.after.visitors-r.prev.visitors],['経済','pt',r.after.economy-r.prev.economy],['静けさ','pt',r.after.quiet-r.prev.quiet]].map(a=>'<div class="resultStat">'+a[0]+'<strong>'+chg(a[2])+a[1]+'</strong></div>').join('')+'</div><button id="nextBtn" class="btn primary" type="button">'+(r.annual?'1年間の村レポートを見る':'1か月後、また村を訪れる')+'</button>';
 showModal(content);if(sound)beep(majors.length>0);$('nextBtn').addEventListener('click',()=>{hideModal();S.result=null;save();if(S.annualDue){S.annualDue=false;showAnnual()}else{document.getElementById('monthTitle').scrollIntoView({behavior:'smooth',block:'center'})}});
}
function showAnnual(){const p=period(-1),e=getEndings();save();let reached=S.achievements.length;let text='<div class="modalHead">'+p.fy+'年度｜12件の口コミが生んだ村</div><div class="milestone">'+(e.main.hidden?'🔓 隠し村エンド発見！':'村の観光パンフレット完成')+'</div><div class="big" style="text-align:center">'+e.main.name+'</div><p style="text-align:center;font-size:13px">'+e.main.desc+'</p><table class="miniTable"><tr><td>定住人口</td><td>'+safe(S.population)+'人（開始時 '+safe(S.startPopulation)+'人）</td></tr><tr><td>月間観光客</td><td>'+safe(S.visitors)+'人（開始時 '+safe(S.startVisitors)+'人）</td></tr><tr><td>経済 / 静けさ</td><td>'+S.economy+' / '+S.quiet+'</td></tr><tr><td>開業・閉業</td><td>新施設 '+S.stats.newFacilities+'件 / 閉業 '+S.stats.closed+'件</td></tr></table><div class="smallHeading">そのほかの村の特徴</div><p>'+e.sub.map(x=>'<span class="badge">'+x.name+'</span>').join(' ')+'</p><div class="smallHeading">印象的な村の出来事</div><div class="annualList">'+S.log.filter(x=>!x.title.startsWith('★')).slice(0,4).map(x=>'<div>'+x.title+'</div>').join('')+'</div><div class="smallHeading">村民の声</div><div class="voices">'+villageVoices()[0]+'</div><div class="smallMuted">あなたの12件の口コミが、この村の1年を形づくりました。</div><button id="keepBtn" class="btn primary" type="button">村の記録に戻る</button><button id="newVillageBtn" class="btn" type="button" style="width:100%;margin-top:8px">新しい村でもう一度遊ぶ</button><button id="copyBtn" class="btn" type="button" style="width:100%;margin-top:8px">今年の村をコピーして共有</button>';
 showModal(text);$('keepBtn').addEventListener('click',()=>{hideModal();chosen=null;render()});$('newVillageBtn').addEventListener('click',()=>{if(confirm('新しい村を生成しますか？（現在の記録は上書きされます）')){hideModal();newWorld((Date.now()^Math.floor(Math.random()*0xffffffff))>>>0);render();showHelp(true)}});$('copyBtn').addEventListener('click',()=>{const msg='村レビュー｜'+S.name+' '+p.fy+'年度\n'+e.main.name+'\n人口 '+S.population+'人・観光客 '+S.visitors+'人\n'+location.href; if(navigator.clipboard?.writeText)navigator.clipboard.writeText(msg).then(()=>{$('copyBtn').textContent='コピーしました'}).catch(()=>{$('copyBtn').textContent='コピーできませんでした'});else $('copyBtn').textContent='コピー非対応の環境です'})}
function showHelp(first=false){const examples=[
 ['★★★★★','地元の食材が最高！もっと有名になってほしい。','話題が広がり、店が大胆に拡大するかも。'],
 ['★★★★☆','地元の商品が良いので、今の品揃えを続けてほしい。','良さを守りながら着実に改善するかも。'],
 ['★★★☆☆','品揃えは良いけれど、少し混んでいました。','現状を維持しながら、小さく変わるかも。'],
 ['★★☆☆☆','レジが混んでいるので、少し改善してほしい。','レジの配置を直すなど、丁寧な改善が進むかも。'],
 ['★☆☆☆☆','行列がひどい。店の運営を根本から見直して！','大改革につながる一方、閉業する可能性も。']
 ];
 showModal('<div class="modalHead">はじめての方へ</div><div class="big" style="margin-top:9px">あなたの口コミが、村の未来を変えます。</div><p>小さな村を訪れたあなた。今月の訪問先からひとつ選び、実際に気づいたことを星と口コミで評価してください。</p><p><strong>口コミを投稿した1か月後に、もう一度村を訪れてみましょう。</strong> 前回と同じ施設を訪ねられるとは限りません。村の施設は、住民や経営状況によっても変化します。</p><div class="smallHeading">例：村のスーパーを訪れたら？</div><p>地元の食材が豊富で魅力的。ただし、レジには長い列ができています。同じ状況でも、星のつけ方によって村の反応は変わるかもしれません。</p><div class="effects">'+examples.map(x=>'<div><strong style="font-size:15px;color:#ac7d2a">'+x[0]+'</strong><div style="font-weight:650;margin:3px 0">「'+x[1]+'」</div><div style="color:#657264">'+x[2]+'</div></div>').join('')+'</div><p>施設が閉業すると口コミできなくなります。でも、別の場所に新しい店ができたり、村の人たちが思わぬ行動を取ることもあります。</p><p><strong>12回の口コミで1年間の物語が完成し、ゲーム終了です。</strong> そのとき、どんな村になっているでしょうか。</p><button id="beginBtn" class="btn primary" type="button">'+(first?'村の観察を始める':'村へ戻る')+'</button>');$('beginBtn').addEventListener('click',()=>{hideModal();render()})}
function beep(big){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C();const now=ctx.currentTime;[523,659,big?1046:784].forEach((freq,i)=>{const osc=ctx.createOscillator(),g=ctx.createGain();osc.type='sine';osc.frequency.setValueAtTime(freq,now+i*.085);g.gain.setValueAtTime(.0001,now+i*.085);g.gain.exponentialRampToValueAtTime(.095,now+i*.085+.01);g.gain.exponentialRampToValueAtTime(.0001,now+i*.085+.24);osc.connect(g);g.connect(ctx.destination);osc.start(now+i*.085);osc.stop(now+i*.085+.26)});setTimeout(()=>ctx.close(),1000)}catch(e){}}
$('helpBtn').addEventListener('click',()=>showHelp(false));$('resetBtn').addEventListener('click',()=>{if(confirm('この村の記録を終了して、新しい村を生成しますか？\n（現在の村の記録は上書きされます）')){newWorld((Date.now()^Math.floor(Math.random()*0xffffffff))>>>0);render();showHelp(true)}});$('soundBtn').addEventListener('click',()=>{sound=!sound;$('soundBtn').textContent=sound?'♪ ON':'♪ OFF';$('soundBtn').setAttribute('aria-pressed',String(sound))});if(load()){chosen=S.candidates[0];render();if(S.result)showResults();else if(S.annualDue||S.completed)showAnnual()}else{newWorld((Date.now()^Math.floor(Math.random()*0xffffffff))>>>0);render();showHelp(true)}
