function v1AcceptManifest(m){

 if(expected.size!==145||items.length!==expected.size)return false;

function aspectLevel(f,key){return Number.isFinite(f.aspectLevels?.[key])?f.aspectLevels[key]:(f.observedFacts?.[key]===true?75:25)}
function applyReviewAspect(f,fa,stars){
 if(stars===3)return;
 f.aspectLevels=f.aspectLevels||{};
 const original=aspectLevel(f,fa.key),polarity=(stars>=4?1:-1)*(fa.high?1:-1);
 const next=stars===2?(fa.high?Math.max(55,original-20):Math.min(50,original+20))
  :stars===4?(fa.high?Math.min(85,original+12):Math.max(15,original-12))
  :clamp(original+polarity*36,0,100);
 f.aspectLevels[fa.key]=next;
 f.observedFacts=f.observedFacts||{};
 f.observedFacts[fa.key]=f.aspectLevels[fa.key]>=55;
 f.lastPolarity=stars>=4?(fa.high?'support-high':'support-low'):(fa.high?'reject-high':'reject-low');
 f.lastFactKey=fa.key;
}
