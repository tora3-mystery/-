  const who=persons.filter(p=>knownSlots(p,full).includes(slot.id)).map(p=>p.id);

  for(const p of who)arr.push([p]);

    if(team.some(id=>!byId(id).trained&&!(used[id]||0)&&!staffMentors[slot.id]&&!team.some(other=>other!==id&&byId(other).trained)))continue;

}

 };

function handle(e){
 const b=e.target.closest("[data-action]");if(!b)return;
 const a=b.dataset.action;
 if(a==="start"){st.screen="play";st.view="interview";st.visited=["t"];}
 if(a==="restart"){st=fresh();st.screen="play";st.view="interview";st.visited=["t"];}
 if(a==="person"){st.person=b.dataset.id;st.visited=[...new Set([...st.visited,st.person])];st.view="interview";}
 if(a==="ask"){ask(st.person,Number(b.dataset.i));}
 if(a==="toggle")toggle(st.person);
 if(a==="advice")st.advice=b.dataset.who;
 if(a==="board"||a==="interview"||a==="offer"||a==="result"){if(a!=="result"||st.result)st.view=a;}
 if(a==="send")send();
 if(a==="finish"){st.result=solve(st.confirmed,true);st.view="result";}
 render();
 if(["board","interview","offer","result","person","start","restart","finish"].includes(a))window.scrollTo({top:0,behavior:"instant"});
}

// B1 5-day recruiting layer. Day advancement is entirely player-controlled.
const DNAME=["月","火","水","木","金"];
const LIMITS={s:[1,4,5,"他店と比較中。今週中に連絡希望"],y:[1,3,4,"早めに面接希望。木曜までに結果希望"],n:[1,2,3,"他店も選考中。火曜までに面接希望"],g:[1,4,4,"木曜までの結果連絡を希望"],t:[2,4,4,"友人も応募中。木曜までの連絡を希望"],h:[2,4,4,"他店と比較中。木曜までに結果希望"],k:[3,5,5,"金曜まで面接・結果連絡が可能"],i:[3,5,5,"日曜夜の勤務を優先。金曜まで待てる"],m:[4,5,5,"金曜中に勤務先を決めたい"],o:[4,5,5,"金曜までの採用連絡を希望"],w:[5,5,5,"金曜の面接・連絡も可能"]};
function freshV3(){return {schema:3,screen:"intro",view:"desk",day:1,used:0,active:null,selected:"s",visited:[],interviewed:[],asked:{},picked:[],confirmed:[],contacted:[],declined:[],pending:{},offerLog:[],status:{},messages:[{kind:"new",id:null,title:"4件の応募が届きました",body:"喫茶まどかの採用活動が始まりました。書類を比較し、面接する人を選びましょう。",day:1}],archive:[],confirmAdvance:false,confirmOffer:null,advice:"",result:null};}

function saveV3(){try{localStorage.setItem("b1-v030",JSON.stringify(st));}catch(e){}}
function status(id){return st.status[id]||"applicant";}
function arrived(id){return LIMITS[id][0]<=st.day;}

function labelV(id){return {applicant:"書類選考中",interview:"面接中",interviewed:"面接済み",offered:"採用通知済み",conditional:"条件付き承諾",confirmed:"採用確定",withdrawn:"選考辞退",declined:"辞退"}[status(id)];}
function lockedV(id){return ["offered","conditional","confirmed"].includes(status(id));}
function msg(kind,id,title,body){const m={kind,id,title,body,day:st.day};st.messages.push(m);st.archive.push(m);}
function interviewV(id){if(st.active||st.used>=2||status(id)!=="applicant"||!arrived(id)||st.day>LIMITS[id][1])return;st.used++;st.active=id;st.selected=id;st.status[id]="interview";st.view="interview";}
function endInterview(){if(!st.active)return;const id=st.active;st.active=null;st.status[id]="interviewed";st.interviewed.push(id);st.view="desk";}

function offerV(id){if(status(id)!=="interviewed"||!st.picked.includes(id)||st.day>LIMITS[id][2])return;st.status[id]="offered";st.contacted.push(id);st.pending[id]=st.day;st.offerLog.push({name:byId(id).name,id,sent:st.day,ok:null,reason:"返答待ち"});}
function morning(day,last){
 st.day=day;st.messages=[];
 for(const p of P){
  const id=p.id;
  if(status(id)==="offered"&&st.pending[id]<day){
   const cond=["t","h","g","i"].includes(id);
   st.status[id]=cond?"conditional":"confirmed";
   if(!cond)st.confirmed.push(id);
   const response=cond?"採用のお話ありがとうございます。ただし、"+p.term+"なら働きたいと思います。":"採用のご連絡ありがとうございます。ぜひよろしくお願いいたします。";
   msg("answer",id,p.name+"さんから"+(cond?"条件付き承諾":"採用承諾")+"のご連絡",response);
   const log=st.offerLog.find(x=>x.id===id);if(log){log.ok=true;log.reason=response;}
  }
 }
 for(const p of P){
  const id=p.id;
  if(!arrived(id))continue;
  if(status(id)==="applicant"&&day>LIMITS[id][1]){
   st.status[id]="withdrawn";st.picked=st.picked.filter(x=>x!==id);
   if(!last && (st.picked.length<4 || !st.picked.every(x=>lockedV(x))))msg("withdraw",id,p.name+"さんから選考辞退のご連絡","お世話になっております。面接のご案内を待っておりましたが、他店で働くことになりました。今回の応募を取り下げます。");
  }else if(status(id)==="interviewed"&&day>LIMITS[id][2]){
   st.status[id]="withdrawn";st.picked=st.picked.filter(x=>x!==id);
   msg("withdraw",id,p.name+"さんから選考辞退のご連絡","面接いただきありがとうございました。ほかのアルバイトに決まりましたので、結果連絡を待たずに辞退いたします。");
  }
 }
 const newly=P.filter(p=>LIMITS[p.id][0]===day);
 if(newly.length)msg("new",null,"新たに"+newly.length+"件の応募",newly.map(p=>p.name).join("・")+"から応募が届きました。");
 if(!last&&!st.messages.length)msg("info",null,"本日の新着連絡はありません","引き続き採用活動を進めてください。");
 st.used=0;st.active=null;st.confirmAdvance=false;st.view="desk";
 if(last){
  const team=st.picked.filter(id=>["confirmed","conditional"].includes(status(id)));
  const estimate=solve(team,true);
  const terms={t:"田中の友人同時勤務",h:"高橋の週2回夜勤",g:"吉田の週2回勤務",i:"伊藤の日曜夜勤務"};
  for(const id of team){
    if(status(id)!=="conditional")continue;
    if(estimate.issues.includes(terms[id])){
      st.status[id]="declined";st.declined.push(id);st.picked=st.picked.filter(x=>x!==id);
      msg("withdraw",id,byId(id).name+"さんから最終辞退のご連絡","採用のお話をいただきありがとうございます。ご相談した勤務条件が成立しないため、今回は辞退させていただきます。");
    }else{
      st.status[id]="confirmed";st.confirmed.push(id);
      msg("answer",id,byId(id).name+"さんの勤務条件が確定","お伝えしていた勤務条件を満たせることを確認しました。よろしくお願いいたします。");
    }
  }
  st.result=solve(st.confirmed,true);
  st.gameSuccess=st.confirmed.length===4&&st.result.filled===target&&st.result.issues.length===0;
  st.screen="result";st.view="result";
 }else st.screen="morning";
}
function advance(force){
 if(st.active)return;
 const due=P.filter(p=>arrived(p.id)&&((status(p.id)==="applicant"&&LIMITS[p.id][1]===st.day)||(status(p.id)==="interviewed"&&LIMITS[p.id][2]===st.day)));
 if(due.length&&!force&&!st.confirmAdvance && (st.picked.length<4||!st.picked.every(x=>lockedV(x)))){st.confirmAdvance=true;return;}
 morning(st.day+1,st.day===5);
}

 root.innerHTML=lastMail+'<div class="card"><div class="eyebrow">SATURDAY / 採用結果</div><h2>5日間の採用活動が終了しました</h2><p class="small">採用確定：'+(st.confirmed.map(nameV).join("・")||"なし")+'</p><p class="small muted">勤務条件が成立しない仮承諾者は、採用確定として数えません。</p></div>'+old+'<div class="footer">B1 α0.3.4</div>';return;
 }
 const view=st.active?"interview":st.view;
 const nav='<nav class="topnav"><button class="tab '+(view==="desk"?"on":"")+'" data-action="desk" '+(st.active?"disabled":"")+'>応募・面接</button><button class="tab '+(view==="board"?"on":"")+'" data-action="board" '+(st.active?"disabled":"")+'>仮シフト</button><button class="tab '+(view==="mail"?"on":"")+'" data-action="mail" '+(st.active?"disabled":"")+'>メール</button></nav>';
 const content=view==="interview"?interviewView():view==="board"?boardV():view==="mail"?archiveV():deskV();
 const desktop=!window.matchMedia("(max-width:780px)").matches;
 root.innerHTML=nav+'<div class="layout '+(view==="board"?"board-alone":"")+'"><section class="main">'+content+'</section><aside class="side">'+(desktop&&view!=="board"?boardV():"")+'</aside></div><div class="footer">B1 α0.3.4｜架空の人物・店舗</div>'+
 '<div class="mobilebar"><button data-action="desk" '+(st.active?"disabled":"")+'>面接</button><button data-action="board" '+(st.active?"disabled":"")+'>仮シフト</button><button data-action="mail" '+(st.active?"disabled":"")+'>メール</button></div>';
}
function handleV3(e){
 const b=e.target.closest("[data-action]");if(!b)return;
 const a=b.dataset.action,id=b.dataset.id;
 if(a==="start"){st.screen="morning";}
 else if(a==="restart"){st=freshV3();st.screen="morning";}
 else if(a==="continue"){st.screen="play";st.view="desk";}
 else if(a==="select"&&arrived(id)){st.selected=id;st.view="desk";st.confirmAdvance=false;st.confirmOffer=null;}
 else if(a==="interview")interviewV(id);
 else if(a==="ask"&&st.active){let arr=st.asked[st.active]||(st.asked[st.active]=[]),i=Number(b.dataset.i);if(arr.length<2&&!arr.includes(i))arr.push(i);}
 else if(a==="end-interview")endInterview();
 else if(a==="candidate"){pick(id);st.confirmOffer=null;}
 else if(a==="offer-one"&&status(id)==="interviewed"&&st.picked.includes(id))st.confirmOffer=id;
 else if(a==="offer-confirm"&&st.confirmOffer===id){offerV(id);st.confirmOffer=null;}
 else if(a==="offer-cancel")st.confirmOffer=null;
 else if(a==="advance"){st.confirmOffer=null;advance(false);}
 else if(a==="advance-confirm")advance(true);
 else if(a==="cancel-advance")st.confirmAdvance=false;
 else if(a==="advice")st.advice=b.dataset.who;
 else if(["desk","board","mail"].includes(a)&&!st.active)st.view=a;
 renderV3();
 if(["start","continue","select","interview","end-interview","advance","advance-confirm","desk","board","mail","restart"].includes(a))window.scrollTo({top:0,behavior:"instant"});
}
st=loadV3();
document.getElementById("app").addEventListener("click",handleV3);
renderV3();
})();
</script></body></html>
