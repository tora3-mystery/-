    const score=count*100-issues.length*2500;
    if(score>best.score){best={score,filled:count,assignment:Object.fromEntries(Object.entries(assign).map(([k,v])=>[k,[...v]])),issues};}
    if(count===target&&issues.length===0)halt=true;
    return;
  }
  let potential=count;
  for(let j=idx;j<S.length;j++)potential+=S[j].n-S[j].f.length;
  if(best.issues.length===0&&potential<best.filled)return;
  const slot=S[idx];
  for(const team of options[idx]){
    if(team.some(id=>(used[id]||0)>=byId(id).cap||(days[id]||[]).includes(slot.day)))continue;
    if(team.some(id=>!byId(id).trained&&!(used[id]||0)&&!staffMentors[slot.id]&&!team.some(other=>other!==id&&byId(other).trained)))continue;
    assign[slot.id]=team;
    for(const id of team){used[id]=(used[id]||0)+1;(days[id]||(days[id]=[])).push(slot.day);}
    dfs(idx+1,count+team.length);
    for(const id of team){used[id]--;days[id].pop();}
  }
  delete assign[slot.id];
 }
 dfs(0,0);
 if(!best.assignment){best={score:0,filled:0,assignment:Object.fromEntries(S.map(s=>[s.id,[]])),issues:[]};}
 return best;
}
