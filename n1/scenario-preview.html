 if(i===9){const item=landmarks[k];put({type:'year',unit:'年',min:1000,max:2100,truth:item.price,zone:[item.price,item.price],item:item.name,emoji:item.emoji,source:item.url,detail:item.detail,speech:'これって何年に'+(k===0?'開業した': '完成した')+'と思う？',context:k===0?'東京駅の丸の内側。駅の開業年を尋ねている。復原工事の年ではない。':k===1?'現在の国会議事堂の竣工年。着工年ではない。':'東京タワーの竣工年。',hint:k===0?'大正時代に開業。':k===1?'昭和11年。':'昭和33年。',explain:'建築や施設の年は質問対象（着工・竣工・開業）を厳密に区別。',mode:'facts'});}
 if(i===10){const truth=[27,29,30][k];put({type:'age',unit:'歳',min:1,max:120,truth,zone:[truth+2,truth+4],item:'陽菜の年齢',emoji:'🪪',speech:'私、何歳に見えます？',context:'陽菜「'+[2021,2019,2018][k]+'年に22歳で新卒入社したんです。今年の誕生日も過ぎました。研修講師なのに、今でも受講生に間違われるんですよ……」',hint:'2026年時点で入社したとき22歳。実年齢を計算できる。陽菜は少し大人に見られたがっている。',explain:'「若く言えば喜ぶ」とは限らない。'});}
 if(i===11){put({truth:gift.price,zone:[Math.round(gift.price*.6),Math.round(gift.price*.87)],item:gift.name,emoji:gift.emoji,source:gift.url,detail:gift.detail,spec:gift.detail,speech:'木曜に見せたこれ、妻に贈ろうと思っていまして。いくらくらいに見えます？',context:'木曜の価格クイズで実際の値段は聞いたはず。庄司は「妻が高価だと恐縮するかも」と迷っている。',hint:'木曜の価格は'+fmt(gift.price)+'円。正確に言っても100点、気を遣って控えめに言っても100点を狙える。',explain:'値段を知っている人でも、質問の意図を読んで違う回答を選べる。木曜の公式価格と完全に一致。'});}
 return obj;
}
function dist(v,t,type){if(type==='yen')return Math.abs(Math.log(Math.max(1,v)/t))/Math.log(1.25);return Math.abs(v-t)/({age:2,min:5,year:10}[type]||1)}
function score(x,q){
 const gap=x<q.zone[0]?dist(x,q.zone[0],q.type):x>q.zone[1]?dist(x,q.zone[1],q.type):0;
 const air=Math.max(0,Math.round(100-gap*40));
 if(x===q.truth)return {score:100,air,exact:true,near:true,success:air>=90};
 const d=dist(x,q.truth,q.type),precision=d<=.04?95:d<=.15?85:d<=.5?65:d<=1?40:0;
 return {score:Math.min(100,Math.max(air,precision)),air,exact:false,near:d<=.5,success:air>=90};
}


const app=document.getElementById('app'),api=window.N1ScenarioV04;
let plan=null,idx=0,answers=[],view='intro',current='',hintCount=3,hintUsed=false,roundId=0,lastFeedback=null;
const fmt2=n=>new Intl.NumberFormat('ja-JP').format(n);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function picksFor(turn) {
 const picks=Array.from({length:12},(_,i)=>(i*7+turn*(i%3+1))%3);
 picks[8]=picks[1];picks[11]=picks[7];
 const sets=[buy,q3Products,q6Products,q7Products,q8Products],positions=[1,2,5,6,7];
 function choose(j,used) {
  if(j>=sets.length)return true;
  const pool=sets[j],i=positions[j],base=picks[i];
  for(let d=0;d<3;d++){
   const k=(base+d)%3,name=pool[k].name;
   if(used.has(name))continue;
   picks[i]=k;used.add(name);
   if(choose(j+1,used))return true;
   used.delete(name);
  }
  return false;
 }
 if(!choose(0,new Set()))throw Error('distinct products could not be generated');
 picks[8]=picks[1];picks[11]=picks[7];
 return picks;
}
function start(){
 roundId++;
 const picks=picksFor(roundId);
 plan=api.createPlan(build,picks);
 idx=0;answers=[];current='';hintCount=3;hintUsed=false;lastFeedback=null;
 view='ask';render();window.scrollTo({top:0});
}
function showLog(){
 const box=document.getElementById('history');
 if(!box)return;
 box.hidden=!box.hidden;
}
function render(){
 if(view==='intro'){app.innerHTML='<section class="panel"><div class="tag">5 DAYS / 10 QUESTIONS</div><h1>その数字、<br>正しく答えていいんだっけ？</h1><p>会話の空気と事実の数字。正解への道は一つではありません。</p><p class="muted">月〜金、各日2問。答えると人物ごとのリアクションと本当の数字が表示され、日替わりで振り返りが入ります。</p><button class="button" id="start">シナリオテストを始める →</button></section>';document.getElementById('start').onclick=start;return}
 if(view==='end'){
  const ep=api.epilogue(answers);
  app.innerHTML='<div class="tag">FRIDAY / COMPLETE</div><h1>'+esc(ep.title)+'</h1><section class="panel"><div class="result-points">'+ep.average+'<span class="small"> / 100 平均点</span></div><p>全10問完了。最終回答のタイプ：'+(ep.lastStyle==='precision'?'数字の正確さ':ep.lastStyle==='empathy'?'空気読み':'迷いの残る回答')+'</p>'+ep.lines.map(l=>'<div class="dialogline"><strong>'+esc(l.speaker)+'</strong>'+esc(l.text)+'</div>').join('')+'</section><div class="panel"><h2>今週の回答</h2><div class="logtable">'+answers.map((r,i)=>'<div class="logrow">'+esc(plan.questions[i].day)+' Q'+(i+1)+'：'+fmt2(r.value)+esc(plan.questions[i].unit)+' → '+fmt2(r.truth)+esc(plan.questions[i].unit)+' ｜'+r.score+'点</div>').join('')+'</div></div><div class="buttons"><button id="restart" class="button">違う組み合わせでもう1周 →</button><a class="button secondary" href="./" style="text-align:center;text-decoration:none">本番版に戻る</a></div>';document.getElementById('restart').onclick=start;return;
 }
 if(view==='break'){
  const completedDay=Math.floor((idx-1)/2),br=api.dayBreak(completedDay,answers);
  app.innerHTML='<div class="tag">DAY COMPLETE</div><section class="panel"><h1>'+esc(br.title)+'</h1><p>'+esc(br.reflection)+'</p><div class="scoreboard"><div><span class="small muted">本日の合計</span><strong>'+br.score+' / 200</strong></div><div><span class="small muted">次の予定</span><strong>'+esc(api.DAYS[completedDay+1])+'</strong></div></div><hr class="line"><p class="muted">'+esc(br.nextIntro)+'</p><button class="button" id="resume" style="width:100%">翌日へ →</button></section>';document.getElementById('resume').onclick=()=>{idx++;view='ask';render();window.scrollTo({top:0})};return;
 }
 const q=plan.questions[idx];
 const common='<div class="tag">'+esc(q.day)+' ｜ 第'+(idx+1)+'問 / 10</div><div class="meter"><div style="width:'+Math.round(idx/10*100)+'%"></div></div><div class="stage">'+esc(q.opening)+'</div><div class="panel"><div class="character">'+esc(faces[q.character].name)+'</div><div class="quote">「'+esc(q.speech)+'」</div><p class="context">'+esc(q.context)+'</p>'+(q.cardType==='none'?'':'<div class="item"><div class="item-title">'+esc(q.item)+'</div><div class="item-sub">'+esc(q.publicDetail)+'</div></div>')+'</div>';
 if(view==='ask'){
  app.innerHTML=common+'<section class="panel"><div class="split"><strong>あなたなら、何と答える？</strong><button class="button secondary small" id="hint" '+(hintCount===0||hintUsed?'disabled':'')+'>💡 ヒント券：残'+hintCount+'</button></div>'+(hintUsed?'<div class="hint">'+esc(q.hint)+'</div>':'')+'<div class="numrow"><input id="number" type="text" inputmode="numeric" autocomplete="off" aria-label="数値を入力" placeholder="数字だけ入力"><strong class="unit">'+esc(q.unit)+'</strong></div><div id="error" class="error" role="alert"></div><button class="button" id="submit" style="width:100%">この数字で回答 →</button></section><section class="panel"><div class="split"><strong class="small">過去の回答は参照できます</strong><button id="logToggle" class="button secondary small">会話ログを開く／閉じる</button></div><div id="history" hidden class="logtable">'+answers.map((a,i)=>'<div class="logrow">Q'+(i+1)+' '+esc(plan.questions[i].day)+'：'+fmt2(a.value)+esc(plan.questions[i].unit)+'（正解 '+fmt2(a.truth)+esc(plan.questions[i].unit)+'）</div>').join('')+'</div></section>';
  const input=document.getElementById('number');input.value=current;
  document.getElementById('hint').onclick=()=>{hintCount--;hintUsed=true;current=input.value;render()};
  document.getElementById('logToggle').onclick=showLog;
  const submit=()=>{
   const v=input.value.normalize('NFKC').replace(/[,，\s]/g,'');
   if(!/^\d+$/.test(v)||v.length>12){document.getElementById('error').textContent='数字だけ入力してください。';return}
   const x=Number(v);
   if(!Number.isSafeInteger(x)||x<q.min||x>q.max){document.getElementById('error').textContent='入力範囲：'+fmt2(q.min)+'〜'+fmt2(q.max);return}
   const grade=score(x,q);
   lastFeedback=api.react(q,x,grade,answers);
   answers.push({...grade,value:x,truth:q.truth,dayIndex:q.dayIndex,legacyIndex:q.legacyIndex});
   hintUsed=false;current='';view='result';render();window.scrollTo({top:0});
  };
  document.getElementById('submit').onclick=submit;
  input.onkeydown=e=>{if(e.key==='Enter')submit()};
  return;
 }
 const a=answers[answers.length-1],reaction=lastFeedback;
 app.innerHTML=common+'<section class="panel"><div class="tag">'+(a.exact?'ピタリ！':'答え合わせ')+'</div><div class="result-points">'+a.score+'<span class="small"> / 100点</span></div>'+reaction.lines.map(l=>'<div class="dialogline"><strong>'+esc(l.speaker)+'</strong>'+esc(l.text)+'</div>').join('')+'<hr class="line"><div class="muted small">実際の数字</div><div class="truth">'+fmt2(q.truth)+esc(q.unit)+'</div><p class="small">'+esc(q.resultDetail)+'</p>'+((q.source&&q.legacyIndex!==8)?'<a rel="noopener noreferrer" target="_blank" href="'+esc(q.source)+'">参考：公式情報・出典</a>':'<span class="small muted">セール情報はゲーム内の架空設定です。</span>')+'<p class="muted small">'+esc(q.explain)+'</p><button class="button" id="next" style="width:100%">'+(idx===9?'エンディングへ →':idx%2===1?'今日の振り返りへ →':'次の質問へ →')+'</button></section>';
 document.getElementById('next').onclick=()=>{
  if(idx===9){view='end';render()}
  else if(idx%2===1){view='break';render()}
  else{idx++;view='ask';render()}
  window.scrollTo({top:0});
 };
}
render();
</script></body></html>
