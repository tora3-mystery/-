 if(i===8){put({truth:p.net,zone:[p.net,p.net],item:p.name+'の別店舗価格',emoji:p.emoji,spec:p.spec,speech:'月曜の梅田さんが買った'+p.name+'、今ネットでいくらだと思う？',context:'架空の別店舗で、同一型番が通常価格'+fmt(p.list)+'円から50%引き。梅田の購入価格は'+fmt(p.price)+'円だった。',hint:fmt(p.list)+'円×0.5。梅田に伝えるべきかは、また別の問題。',detail:'架空店舗のセール価格。メーカー公式価格を使う実在商品クイズとは別のフィクション。',explain:'月曜の購入額と金曜の他店セール価格は、どちらもその場の事実。',mode:'facts'});}

function dist(v,t,type){if(type==='yen')return Math.abs(Math.log(Math.max(1,v)/t))/Math.log(1.25);return Math.abs(v-t)/({age:2,min:5,year:10}[type]||1)}
function score(x,q){
 const gap=x<q.zone[0]?dist(x,q.zone[0],q.type):x>q.zone[1]?dist(x,q.zone[1],q.type):0;
 const air=Math.max(0,Math.round(100-gap*40));
 if(x===q.truth)return {score:100,air,exact:true,near:true,success:air>=90};
 const d=dist(x,q.truth,q.type),precision=d<=.04?95:d<=.15?85:d<=.5?65:d<=1?40:0;
 return {score:Math.min(100,Math.max(air,precision)),air,exact:false,near:d<=.5,success:air>=90};
}
function quote(q,x,res){
 if(res.exact){

  if(q.i===3)return '分まで把握してるなら、遅れないでよ！';
  if(q.i===5)return '価格まで当てちゃうんですね。お店の人ですか？';
  if(q.i===10)return 'すごい！ 正解です。どうして分かったんですか？';
  if(q.i===11)return '……価格を知っている人の答え方ですね。贈り方を考えます。';
  return 'えっ、ピッタリ！ なんで分かったんですか!?';
 }
 if(res.success){
  if(q.i===0)return 'あら、うれしい！ でも気を遣いすぎてもだめよ。';
  if(q.i===1)return 'そんなに高く見える!? 実はもっと安かったんだよ！';
  if(q.i===3)return 'そう、そのくらい！ 次は時間通りね！';
  if(q.i===5)return 'そのくらいの印象なら、気軽に受け取ってもらえそう。';
  if(q.i===10)return 'そうそう！ そのくらいに見られたいんです！';
  if(q.i===11)return 'なるほど。その言い方なら気を遣わせずに済みそうですね。';
  return 'おっ、かなりいいところです！ 話が早い！';
 }
 if(q.i===0)return x>q.truth?'……そう、そんなに大人に見えるのね。':'そんなに若いわけないでしょ。お世辞も技術よ。';
 if(q.i===1)return x<q.truth?'……これでも、そこそこしたんだけど。':'そこまでいくと宝石が入ってない？';
 if(q.i===3)return x<q.truth?'もっと待ったってば！ 時計見て！':'そんなに待ってない。いや、話を盛るのも違うのよ。';
 if(q.i===5)return x>q.truth?'そんなに高級に見えたら、お返しを気にさせそう……':'うーん、もうちょっと良いものに見えないかな。';
 if(q.i===10)return x<q.truth?'……それ、私が一番困ってるやつです。':'いや、そこまで年上には見られたくないです！';
 if(q.i===11)return x>q.truth?'実際より高く見えるんですね。まあ、贈り物は気持ちですから。':'えっと、思ったより安っぽく見えるんですね……';
 return '正解を聞くと、ちょっと驚きますよ。';
}

function render(){

 if(screen==='end'){let avg=Math.round(results.reduce((a,r)=>a+r.score,0)/results.length),exact=results.filter(r=>r.exact).length,good=results.filter(r=>r.success).length;let rank=avg>=90?'数字の魔術師':avg>=75?'空気読みの達人':avg>=55?'社交辞令の修行中':'数字で空気をかき回す人';let items=results.map((r,i)=>'<li><div class="left"><span class="small muted">'+days[i]+' / Q'+(i+1)+'</span><strong>'+escapeHtml(slots[i])+'</strong><span class="small muted">'+fmt(r.value)+r.unit+' → '+fmt(r.truth)+r.unit+'</span></div><div class="right">'+r.score+'点'+(r.exact?' 🎯':'')+'</div></li>').join('');app.innerHTML='<div class="kicker" style="margin-top:30px">ONE WEEK COMPLETE / ROUND '+round+'</div><h1 class="title" style="font-size:clamp(34px,7vw,56px)">数字って、<br><em>難しい。</em></h1><div class="panel confetti"><div class="muted">あなたの称号</div><h2 style="font-size:30px;margin:6px 0">'+rank+'</h2><div class="score">'+avg+'<small> / 100 平均</small></div></div><div class="endstat"><div><strong>'+exact+'</strong><span>ピタリ的中</span></div><div><strong>'+good+'</strong><span>会話成功</span></div><div><strong>'+results.length+'</strong><span>回答した問題</span></div></div><div class="panel"><h2 style="margin-top:0">1週間の答え合わせ</h2><ul class="review">'+items+'</ul></div><p class="muted">商品は公式税込通常価格。人物・買い物の架空エピソードはフィクションです。</p><div class="flexbuttons"><button class="button" id="again">別の数字で、もう1週間 →</button><button class="button secondary" id="logEnd">会話ログ</button></div>';document.getElementById('again').onclick=()=>{initRound();screen='play';render()};document.getElementById('logEnd').onclick=showLog;return}
 const q=build(state.i,picks[state.i],picks),p=faces[q.person],pct=Math.round(100*state.i/12),isResult=state.phase==='result';
 let top='<div class="dayline"><span class="day">'+q.day+'</span><span class="stamp">Q'+(state.i+1)+' '+q.slot+'</span><span class="step">'+(state.i+1)+' / 12</span></div><div class="bar"><span style="width:'+pct+'%"></span></div>';
