 if(q.mode==='facts'){
  if(x===q.truth)return {score:100,air:0,exact:true,near:true,success:false};
  return {score:Math.max(0,Math.min(99,Math.round(100-d*22))),air:0,exact:false,near:d<=.5,success:false};
 }
 const gap=x<q.zone[0]?dist(x,q.zone[0],q.type):x>q.zone[1]?dist(x,q.zone[1],q.type):0;
 const air=Math.max(0,Math.round(100-gap*40));

 if(!isResult){app.innerHTML=top+lead+'<div class="hintrow"><button id="hint" class="hintbtn" '+(hints===0||hintShown?'disabled':'')+'>💡 ヒント券を使う（残'+hints+'）</button></div>'+(hintShown?'<div class="hinttext">💡 '+escapeHtml(q.hint)+'</div>':'')+'<label for="number" class="inputlabel">あなたなら、何と答える？</label><div class="entryrow"><input id="number" class="entry" type="text" inputmode="numeric" autocomplete="off" maxlength="12" enterkeyhint="done" placeholder="数字を入力" aria-describedby="err"><span class="unit">'+q.unit+'</span></div><div class="inputtip" id="err" role="status">整数で入力。単位は不要。確定後は変更できません。</div><button class="button" id="submit" style="width:100%">この数字で答える！ →</button></div><div class="small muted">※ 価格の公式出典は答え合わせで表示します。会話ログから過去の数字を確認できます。</div>';const inp=document.getElementById('number');if(current)inp.value=current;inp.focus({preventScroll:true});const err=document.getElementById('err');const sub=()=>{let txt=inp.value.replace(/[,，\s]/g,'').trim();if(!/^[0-9]+$/.test(txt)||txt.length>12){err.textContent='半角数字の整数を入力してください。';inp.setAttribute('aria-invalid','true');return}const x=Number(txt);if(!Number.isSafeInteger(x)||x<q.min||x>q.max){err.textContent=fmt(q.min)+'〜'+fmt(q.max)+'の範囲で入力してください。';inp.setAttribute('aria-invalid','true');return}inp.removeAttribute('aria-invalid');const r=score(x,q);results.push({...r,value:x,truth:q.truth,unit:q.unit,dayIndex:q.dayIndex,legacyIndex:q.legacyIndex});state.phase='result';state.value=x;current='';hintShown=false;render()};document.getElementById('submit').onclick=sub;inp.onkeydown=e=>{if(e.key==='Enter')sub()};document.getElementById('hint').onclick=()=>{if(!hintShown&&hints>0){hints--;hintShown=true;current=inp.value;render()}};return}
 const x=state.value,r=results[results.length-1],dialogue=window.N1ScenarioV04.react(q,x,r,results.slice(0,-1)),isDirect=q.mode==='facts',scoreLabel=r.exact?(r.success?'奇跡のダブル成功！':'ピタリ的中！'):r.success?'会話、大成功！':r.score>=80?'ニアピン！':r.score<20?'大外れ！':'そんな答えも、ある。';
 const diff=q.type==='yen'?'誤差 '+fmt(Math.abs(x-q.truth))+'円':q.type==='age'?'誤差 '+Math.abs(x-q.truth)+'歳':q.type==='min'?'誤差 '+Math.abs(x-q.truth)+'分':'誤差 '+Math.abs(x-q.truth)+'年';
 app.innerHTML=top+lead+'</div><section class="confetti"><h2 class="result-title">'+scoreLabel+'</h2><div class="scorebox"><div class="small">今回の得点（ピタリは無条件100点）</div><div class="score">'+r.score+'<small> / 100</small></div><div class="small">'+(r.exact?'🎯 数値完全一致':r.success?'💬 相手の意図に合った回答':'📊 '+diff)+'</div></div><div class="reaction">'+dialogue.lines.map(line=>'<div class="reaction-turn"><strong>'+escapeHtml(line.speaker)+'</strong>「'+escapeHtml(line.text)+'」</div>').join('')+'</div><div class="truth"><div class="small muted">あなたの回答</div><div style="font-weight:900;font-size:23px">'+fmt(x)+q.unit+'</div><div class="small muted">実際の数字・答え</div><div class="truthnum">'+fmt(q.truth)+q.unit+'</div><div class="small">'+escapeHtml(q.explain)+'</div></div>'+(q.resultDetail?'<div class="note" style="margin-top:12px">'+escapeHtml(q.resultDetail)+'</div>':'')+(q.source?'<div class="note" style="margin-top:8px">📎 出典：<a target="_blank" rel="noopener noreferrer" href="'+escapeHtml(q.source)+'">公式情報を見る</a><br>参照基準日：'+escapeHtml(q.factDate||PRICE_DATE)+'</div>':'<div class="note" style="margin-top:8px">'+(q.legacyIndex===8?'※ 割引キャンペーンとセール価格はゲーム内の架空設定です。公式通常価格とは異なります。':'※ この会話・出来事はゲーム内の架空設定です。')+'</div>')+'<button class="button" id="next" style="width:100%;margin-top:18px">'+(state.i===9?'今週の成績を見る →':state.i%2===1?'今日の振り返りへ →':'次の質問へ →')+'</button></section>';document.getElementById('next').onclick=()=>{state.i++;state.phase='ask';if(state.i>=10)screen='end';else if(state.i%2===0)screen='daybreak';render();window.scrollTo({top:0,behavior:'instant'})}
}
function showLog(){const completed=results.map((r,i)=>{let q=plan.questions[i];return '<div class="logitem"><small>'+q.day+' Q'+(i+1)+' ｜ '+faces[q.person].name+'</small><strong>'+escapeHtml(q.speech)+'</strong><div>回答 '+fmt(r.value)+r.unit+' ／ 正解 '+fmt(r.truth)+r.unit+' ｜ '+r.score+'点</div></div>'}).join('');logMount.innerHTML='<div class="log-overlay" id="overlay"><div class="logbox" role="dialog" aria-modal="true" aria-label="会話ログ"><div class="row"><h2>今週の会話ログ</h2><button class="tiny" id="closeLog">閉じる ×</button></div>'+(completed||'<p class="muted">まだ回答した問題はありません。</p>')+'</div></div>';document.getElementById('closeLog').onclick=closeLog;document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')closeLog()};document.addEventListener('keydown',escLog);}
function escLog(e){if(e.key==='Escape')closeLog()}
function closeLog(){logMount.innerHTML='';document.removeEventListener('keydown',escLog)}
function openProduct(button){const src=button.dataset.productSrc,label=button.dataset.productLabel;productMount.innerHTML='<div class="product-overlay" id="productOverlay"><div class="productbox" role="dialog" aria-modal="true" aria-label="商品画像の拡大表示"><div class="row"><h2>'+escapeHtml(label)+'</h2><button class="tiny" id="closeProduct">閉じる ×</button></div><img src="'+src+'" width="800" height="600" alt="'+escapeHtml(label)+'"></div></div>';document.body.style.overflow='hidden';document.getElementById('closeProduct').onclick=closeProduct;document.getElementById('productOverlay').onclick=e=>{if(e.target.id==='productOverlay')closeProduct()};document.addEventListener('keydown',escProduct);document.getElementById('closeProduct').focus()}
function escProduct(e){if(e.key==='Escape')closeProduct()}
function closeProduct(){productMount.innerHTML='';document.body.style.overflow='';document.removeEventListener('keydown',escProduct)}
app.addEventListener('click',e=>{const button=e.target.closest('.product-zoom');if(button)openProduct(button)});
logButton.onclick=showLog;render();
